[project]
name = "wheel-n-deal"
version = "3.0.1"
description = "Personal price tracker: polite fetch, structured price extraction, ntfy alerts."
requires-python = ">=3.12"
license = { text = "GNU General Public License v3.0" }
dependencies = [
    "beautifulsoup4==4.15.0",
    "brotli==1.2.0",
    "httpx==0.28.1",
    "playwright==1.63.0",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "zstandard==0.25.0",
]

[project.scripts]
wheel-n-deal = "wheel_n_deal.main:run"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wheel_n_deal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wheel_n_deal"]
