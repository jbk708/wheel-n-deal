services:
  wheel-n-deal:
    build:
      context: .
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    # Outbound to shops, MiMo and ntfy; the only listener is the API on 127.0.0.1:8090,
    # reachable from this host only, so no ports are published.
    network_mode: host
    restart: unless-stopped
    # Headroom for the headless Chromium fallback (one browser at a time, closed after use).
    mem_limit: 1536m
    # Chromium threads count too: one heavy page peaked near 200.
    pids_limit: 512
    # The app runs unprivileged and Playwright starts Chromium with --no-sandbox,
    # so no capability is needed.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      # Chromium's shared memory (--disable-dev-shm-usage) and its profile.
      - /tmp:size=256m
      # Chromium's crashpad handler won't start without a writable $HOME.
      - /home/app:size=64m,uid=${APP_UID:-1000},gid=${APP_GID:-1000}
    # Reaps Chromium's child processes; the app itself is not an init process.
    init: true
    env_file: .env
    environment:
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      # ./config.yaml and ./data must exist and be owned by APP_UID:APP_GID
      # before the first `up`: Docker creates missing bind mounts as root (a
      # missing file as a directory), which the non-root user can't use.
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
